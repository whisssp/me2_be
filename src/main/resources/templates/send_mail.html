<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Reset Your Password</title>
    <style>
        body, .email-container {
            margin: 0 auto;
            padding: 0;
            width: 100%;
            max-width: 600px;
            font-family: Arial, sans-serif;
            line-height: 1.5;
            color: #333333;
        }

        .email-header {
            background-color: #007BFF;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }

        .email-body {
            padding: 20px;
            background-color: #f4f4f4;
        }

        .email-body p {
            margin: 0 0 15px;
            font-size: 16px;
        }

        .reset-button {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #007BFF;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 16px;
        }

        .reset-button:hover {
            background-color: #0056b3;
        }

        .token-container {
            text-align: center;
            margin: 20px 0;
        }

        .token-label {
            font-size: 18px;
            color: #555555;
            margin-bottom: 10px;
        }

        .token {
            display: inline-block;
            font-family: "Courier New", Courier, monospace;
            font-size: 24px;
            letter-spacing: 3px;
            color: #ffffff;
            background-color: #1a73e8;
            padding: 15px 20px;
            border-radius: 8px;
            margin-top: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .token-container .token:hover {
            background-color: #185abc;
        }

        .email-footer {
            margin-top: 20px;
            padding: 10px;
            font-size: 12px;
            color: #777777;
            text-align: center;
            background-color: #f4f4f4;
        }

        @media (max-width: 600px) {
            .email-header, .email-body, .email-footer {
                padding-left: 10px;
                padding-right: 10px;
            }
        }
    </style>
</head>
<body>
<div class="email-container">
    <div class="email-header">
        Reset Your Password
    </div>
    <div class="email-body">
        <p th:text="'Hi ' + ${username} + ','"></p>
        <p>We received a request to forgot your password.</p>
        <div class="token-container">
            <p class="token-label">Your Reset Token:</p>
            <span class="token" th:text="${token}"></span>
        </div>
        <a th:href="@{${resetUrl}}" class="reset-button">Reset Password</a>
        <p>If you didn't request this, please ignore this email.</p>
    </div>
    <div class="email-footer">
        <p>&copy; 2024 Your Company. All rights reserved.</p>
    </div>
</div>
</body>
</html>
